<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <title>{{ title }} - Jonah Merriam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="site-nav">
    <a href="../" class="nav-mark">JM_</a>
    <ul class="nav-links">
      <li><a href="../">home</a></li>
      <li><a href="index.html">blog</a></li>
    </ul>
  </nav>

  <header class="hero hero-sm">
    <div class="hero-content">
      <h1 class="reveal" data-reveal="up">{{ title }}</h1>
      <p class="hero-subtitle reveal" data-reveal="up">{{ summary }}</p>
    </div>
  </header>

  <section class="post" id="content">
    <div class="container">
      <article class="post-body reveal" data-reveal="up">
        <p class="post-meta">Published <span class="post-date">{{ display_date }}</span></p>
{{ content }}
      </article>
    </div>
  </section>

  <footer class="site-footer">
    <span>&copy; <span id="current-year"></span> Jonah Merriam</span>
    <span class="footer-sep">&middot;</span>
    <a href="../">home</a>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
